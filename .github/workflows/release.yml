name: release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qa:
    runs-on: ubuntu-latest
    env:
      # Reaches the container only because docker-compose.yml declares MUTATION_THREADS in its
      # `environment:` map -- Compose does not forward undeclared host variables. See the same note
      # in ci.yml.
      MUTATION_THREADS: '4'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Build PHP container
        run: docker compose build php
      - name: Install dependencies
        run: docker compose run --rm php sh scripts/run-composer-in-ci.sh install
      - name: Validate root Composer manifest
        run: docker compose run --rm php sh scripts/run-composer-in-ci.sh validate --strict
      - name: Validate core package manifest
        run: docker compose run --rm php sh scripts/run-composer-in-ci.sh validate --strict -d packages/core
      - name: Validate Symfony bundle manifest
        run: docker compose run --rm php sh scripts/run-composer-in-ci.sh validate --strict -d packages/symfony-bundle
      - name: Run QA suite
        run: docker compose run --rm php sh scripts/run-composer-in-ci.sh qa
      - name: Run full mutation sweep
        run: docker compose run --rm php sh scripts/run-composer-in-ci.sh mutation:full
      - name: Collect release artifacts
        run: |
          mkdir -p release-artifacts
          # The UCP version this tag serves, read from the source being released. The
          # release title is derived from it below, so a reader of the release list sees
          # the protocol version next to the SDK version without opening the notes.
          docker compose run --rm php php tools/print-ucp-version.php > release-artifacts/ucp-version.txt
          test -s release-artifacts/ucp-version.txt
          cp var/reports/infection/summary.log release-artifacts/infection-summary.log
          cp var/reports/infection-full/summary.log release-artifacts/infection-full-summary.log
          cp var/reports/coverage/internal-summary.json release-artifacts/coverage-internal-summary.json
          cp var/reports/pdepend/summary.xml release-artifacts/pdepend-summary.xml
      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-artifacts
          path: release-artifacts/*
          if-no-files-found: error

  draft-release:
    needs: qa
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          name: release-artifacts
          path: release-artifacts
      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          # Title format is `<tag> — UCP <date>`, e.g. `0.0.6 — UCP 2026-08-25`. The SDK
          # serves exactly one UCP version per release (docs/ucp-version-support-policy.md),
          # so the release list is where an adopter finds out which; it must not depend on
          # someone remembering to type it. release-title-guard.yml refuses a published
          # release whose title drifted from this.
          ucp_version="$(tr -d '[:space:]' < release-artifacts/ucp-version.txt)"
          title="$TAG — UCP $ucp_version"
          echo "Release title: $title"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --draft --title "$title"
          else
            gh release create "$TAG" \
              --draft \
              --generate-notes \
              --title "$title" \
              --notes "Serves UCP \`$ucp_version\`. Packages: \`ucp-php-sdk/core:$TAG\`, \`ucp-php-sdk/symfony-bundle:$TAG\`."
          fi

          gh release upload "$TAG" release-artifacts/* --clobber
