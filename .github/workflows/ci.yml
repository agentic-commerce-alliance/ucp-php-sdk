name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # 8.5 is advisory: the published packages declare "php": "^8.1" with no upper bound, so
    # forward compatibility deserves a real signal, but the dev toolchain is resolved against
    # config.platform.php = 8.2.0 and is not guaranteed to be deprecation-free on 8.5 yet.
    # A regression there should surface here without blocking unrelated pull requests.
    # Promote it to a blocking lane once it has been green for a while.
    continue-on-error: ${{ matrix.php == '8.5' }}
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
    env:
      MUTATION_THREADS: '4'
      PHP_VERSION: ${{ matrix.php }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Build PHP container
        run: docker compose build php
      - name: Install dependencies
        run: docker compose run --rm php sh scripts/run-composer-in-ci.sh install
      - name: Validate root Composer manifest
        run: docker compose run --rm php sh scripts/run-composer-in-ci.sh validate --strict
      - name: Validate core package manifest
        run: docker compose run --rm php sh scripts/run-composer-in-ci.sh validate --strict -d packages/core
      - name: Validate Symfony bundle manifest
        run: docker compose run --rm php sh scripts/run-composer-in-ci.sh validate --strict -d packages/symfony-bundle
      # Carries `require-check` (used-but-undeclared dependencies), which installs each
      # package on its own — checking at the root would measure the monorepo's dev
      # requirements rather than what a consumer of a published package gets.
      - name: Run QA suite
        run: docker compose run --rm php sh scripts/run-composer-in-ci.sh qa
      - name: Run full mutation sweep
        if: matrix.php == '8.2'
        run: docker compose run --rm php sh scripts/run-composer-in-ci.sh mutation:full
  lint-php81:
    name: lint (php-8.1)
    runs-on: ubuntu-latest
    env:
      PHP_VERSION: '8.1'
    steps:
      - uses: actions/checkout@v7
      - name: Build PHP 8.1 container
        run: docker compose build php
      # The dev toolchain (PHPUnit 11, infection, ...) requires PHP >= 8.2, so the
      # full qa suite cannot run on 8.1. The published packages declare "php": "^8.1",
      # so lint their sources on 8.1 to guarantee they parse there and guard against
      # 8.2-only syntax (e.g. readonly classes) creeping back in.
      - name: Lint published sources on PHP 8.1
        run: docker compose run --rm php sh -c 'find packages/core/src packages/symfony-bundle/src -name "*.php" -print0 | xargs -0 -n1 php -l'
  # Two questions, and only one of them belongs to a pull request:
  #
  #   * does THIS pull request break compatibility?     -> blocking, baseline = target branch
  #   * has anything broken since the last release?     -> notice, baseline = newest tag
  #
  # They were one step against the newest tag, which meant a break already merged on the base
  # branch failed every subsequent pull request — #114's intentional, documented break did
  # exactly that to #118 the moment the check started working. The second question is a
  # release question: pre-1.0 breaks are allowed, so its answer belongs in the changelog and
  # the version bump, not in a merge gate.
  bc:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # For the since-the-last-release comment below. The workflow default is read-only.
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Build PHP container
        run: docker compose build php
      - name: Install dependencies
        run: docker compose run --rm php sh scripts/run-composer-in-ci.sh install
      # Via the script, not the checker directly: Roave analyses the *root* package's
      # sources, and this root declares no autoload, so the direct invocation compared
      # nothing and passed unconditionally (#115). scripts/bc-check.sh compares each
      # published package as what it is published as — its own repository.
      #
      # The baseline is the branch this pull request targets, so the finding is the pull
      # request's own. HEAD already contains the base branch because `actions/checkout`
      # checks out the merge ref for `pull_request` events — if that is ever pinned to the
      # head SHA, this has to become `git merge-base origin/${{ github.base_ref }} HEAD`.
      - name: Backward compatibility check (this pull request)
        run: docker compose run --rm php sh scripts/bc-check.sh "origin/${{ github.base_ref }}"
      - name: Resolve the newest release tag
        id: baseline
        run: |
          tag="$(git tag --merged "origin/${{ github.base_ref }}" --sort=-v:refname | head -n 1)"

          if [ -z "$tag" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "No release tag on origin/${{ github.base_ref }} yet; nothing to compare a release against."
            exit 0
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Newest release tag: $tag"
      # Advisory, in the same spirit as the 8.5 test lane: a real signal that must not block
      # unrelated pull requests. `|| true` as well as continue-on-error, so the log is
      # captured for the comment either way.
      - name: Backward compatibility since the last release
        id: since_release
        if: steps.baseline.outputs.skip != 'true'
        continue-on-error: true
        run: |
          docker compose run --rm php sh scripts/bc-check.sh "${{ steps.baseline.outputs.tag }}" \
            > bc-since-release.log 2>&1 || true
          cat bc-since-release.log
      # One comment, edited in place on every re-run. Keyed by a hidden marker rather than
      # `gh pr comment --edit-last`, which edits whatever the actor commented last.
      # Skipped for forks: their token is read-only, and a comment that cannot be posted must
      # not read as a failed check.
      - name: Comment the release-compatibility notice
        if: |
          steps.baseline.outputs.skip != 'true'
          && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          TAG: ${{ steps.baseline.outputs.tag }}
        run: sh scripts/comment-bc-since-release.sh bc-since-release.log
